<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d2238"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <filter id="glowMagenta">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Hanger -->
  <path d="M 200 65 Q 200 45 215 45 Q 225 45 220 60 Q 215 70 200 85 L 140 115 L 260 115 Z" fill="none" stroke="#ff007f" stroke-width="2.5" filter="url(#glowMagenta)"/>

  <!-- T-Shirt Cut (Branco) -->
  <path d="M 140 115 L 95 145 L 120 195 L 148 180 L 148 335 L 252 335 L 252 180 L 280 195 L 305 145 L 260 115 C 240 135 160 135 140 115 Z" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"/>
  
  <!-- Collar -->
  <path d="M 158 115 C 168 140 232 140 242 115" fill="none" stroke="#111424" stroke-width="4"/>

  <!-- Big adidas Trefoil Logo (Preto) -->
  <circle cx="200" cy="180" r="22" fill="#111424"/>
  <rect x="175" y="195" width="50" height="4" fill="#ffffff"/>
  <text x="200" y="218" font-family="sans-serif" font-weight="900" font-size="13" fill="#111424" text-anchor="middle">adidas</text>
</svg>
