<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181e36"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="hoodieBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a304a"/>
      <stop offset="50%" stop-color="#181d33"/>
      <stop offset="100%" stop-color="#0f1224"/>
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Hanger -->
  <path d="M 200 65 Q 200 45 215 45 Q 225 45 220 60 Q 215 70 200 85 L 130 115 L 270 115 Z" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#glowCyan)"/>

  <!-- Hoodie Body -->
  <path d="M 130 115 L 85 160 L 115 220 L 145 195 L 145 340 L 255 340 L 255 195 L 285 220 L 315 160 L 270 115 C 240 100 160 100 130 115 Z" fill="url(#hoodieBody)" stroke="#00f3ff" stroke-width="1.5"/>

  <!-- Hood Structure -->
  <path d="M 160 105 C 160 60 240 60 240 105 C 220 125 180 125 160 105 Z" fill="#121628" stroke="#ff007f" stroke-width="1.5"/>

  <!-- Zipper & Chevron -->
  <line x1="200" y1="125" x2="200" y2="340" stroke="#00f3ff" stroke-width="2.5" filter="url(#glowCyan)"/>
  <path d="M 145 160 L 200 200 L 255 160" fill="none" stroke="#2e3759" stroke-width="3"/>

  <!-- Arm Arm Pocket Zippers -->
  <line x1="110" y1="180" x2="125" y2="205" stroke="#ff007f" stroke-width="2"/>
</svg>
