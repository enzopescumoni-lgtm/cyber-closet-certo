<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161c33"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="jacketFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121524"/>
      <stop offset="100%" stop-color="#090b14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Firebird Collar & Body -->
  <path d="M 140 110 L 90 150 L 120 215 L 150 190 L 150 335 L 250 335 L 250 190 L 280 215 L 310 150 L 260 110 L 240 85 L 160 85 Z" fill="url(#jacketFabric)" stroke="#ff007f" stroke-width="1.5"/>

  <!-- High Collar -->
  <rect x="160" y="85" width="80" height="30" rx="3" fill="#1b2038" stroke="#00f3ff" stroke-width="1.5"/>

  <!-- adidas 3-Stripes Sleeves -->
  <line x1="140" y1="110" x2="90" y2="150" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="143" y1="115" x2="93" y2="155" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="146" y1="120" x2="96" y2="160" stroke="#ffffff" stroke-width="2.5"/>

  <line x1="260" y1="110" x2="310" y2="150" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="257" y1="115" x2="307" y2="155" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="254" y1="120" x2="304" y2="160" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Front Zipper -->
  <line x1="200" y1="85" x2="200" y2="335" stroke="#00f3ff" stroke-width="2" filter="url(#glow)"/>

  <!-- adidas Trefoil Logo -->
  <circle cx="175" cy="155" r="8" fill="#ffffff"/>
</svg>
