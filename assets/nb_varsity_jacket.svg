<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14261d"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <filter id="glowYellow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Varsity Body (Verde Musgo / Lã) -->
  <path d="M 140 110 L 145 335 L 255 335 L 260 110 Z" fill="#1b3d2b" stroke="#ffb703" stroke-width="1.5"/>

  <!-- Leather Sleeves (Creme) -->
  <path d="M 140 110 L 90 150 L 120 215 L 148 190 Z" fill="#f0eae1" stroke="#ffb703" stroke-width="1"/>
  <path d="M 260 110 L 310 150 L 280 215 L 252 190 Z" fill="#f0eae1" stroke="#ffb703" stroke-width="1"/>

  <!-- Ribbed Collar & Buttons -->
  <rect x="160" y="90" width="80" height="20" rx="4" fill="#0d2116" stroke="#ffffff" stroke-width="1"/>
  <circle cx="200" cy="140" r="4" fill="#ffb703"/>
  <circle cx="200" cy="170" r="4" fill="#ffb703"/>
  <circle cx="200" cy="200" r="4" fill="#ffb703"/>

  <!-- New Balance NB Patch -->
  <text x="175" y="155" font-family="Orbitron, sans-serif" font-weight="900" font-size="22" fill="#ffb703" filter="url(#glowYellow)">NB</text>
</svg>
