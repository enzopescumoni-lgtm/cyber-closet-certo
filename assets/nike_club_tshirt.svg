<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14192e"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Hanger -->
  <path d="M 200 65 Q 200 45 215 45 Q 225 45 220 60 Q 215 70 200 85 L 140 115 L 260 115 Z" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- T-Shirt Cut (Preto) -->
  <path d="M 140 115 L 95 145 L 120 195 L 148 180 L 148 335 L 252 335 L 252 180 L 280 195 L 305 145 L 260 115 C 240 135 160 135 140 115 Z" fill="#111424" stroke="#00f3ff" stroke-width="1.5"/>
  
  <!-- Collar -->
  <path d="M 158 115 C 168 140 232 140 242 115" fill="none" stroke="#252c48" stroke-width="3.5"/>

  <!-- Nike Swoosh (Branco) -->
  <path d="M 175 160 C 185 170 200 175 220 160 C 205 170 190 173 180 168 Z" fill="#ffffff"/>
</svg>
