<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c203b"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Hanger -->
  <path d="M 200 65 Q 200 45 215 45 Q 225 45 220 60 Q 215 70 200 85 L 130 115 L 270 115 Z" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#glowCyan)"/>

  <!-- Oversized T-Shirt Cut (Branco Off-White) -->
  <path d="M 130 115 L 80 155 L 110 215 L 142 195 L 142 340 L 258 340 L 258 195 L 290 215 L 320 155 L 270 115 C 240 135 160 135 130 115 Z" fill="#e2e6f0" stroke="#00f3ff" stroke-width="1.5"/>
  
  <!-- Collar -->
  <path d="M 152 115 C 165 140 235 140 248 115" fill="none" stroke="#b0b8d0" stroke-width="4"/>

  <!-- Nike Swoosh (Preto) -->
  <path d="M 175 165 C 185 175 200 180 220 165 C 205 175 190 178 180 173 Z" fill="#111424"/>
</svg>
