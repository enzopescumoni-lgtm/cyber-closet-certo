<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161c33"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="pantsFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2138"/>
      <stop offset="100%" stop-color="#0d101d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Pants Cut -->
  <path d="M 140 70 L 260 70 L 250 340 L 210 340 L 200 180 L 190 340 L 150 340 Z" fill="url(#pantsFabric)" stroke="#00f3ff" stroke-width="1.5"/>

  <!-- Elastic Waistband & Drawstrings -->
  <rect x="140" y="70" width="120" height="20" rx="3" fill="#121629" stroke="#ff007f" stroke-width="1"/>
  <line x1="195" y1="85" x2="190" y2="120" stroke="#ffffff" stroke-width="2"/>
  <line x1="205" y1="85" x2="210" y2="120" stroke="#ffffff" stroke-width="2"/>

  <!-- Tech Zipper Side Pockets -->
  <line x1="230" y1="100" x2="245" y2="180" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="170" y1="100" x2="155" y2="180" stroke="#00f3ff" stroke-width="1"/>

  <!-- Ankle Ribbed Cuffs -->
  <rect x="150" y="330" width="40" height="15" fill="#090b14" stroke="#ff007f" stroke-width="1"/>
  <rect x="210" y="330" width="40" height="15" fill="#090b14" stroke="#ff007f" stroke-width="1"/>
</svg>
