<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141936" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090c1e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050711"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9d4edd" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="neonGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Box -->
  <rect width="500" height="500" rx="24" fill="url(#studioGlow)"/>
  
  <!-- Studio Circular Podium Light -->
  <ellipse cx="250" cy="410" rx="160" ry="40" fill="rgba(0,243,255,0.03)" filter="drop-shadow(0 0 20px #9d4edd)"/>
  <ellipse cx="250" cy="410" rx="120" ry="25" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#softShadow)">
    <!-- Button Shirt Body -->
    <path d="M140 120 L190 85 L310 85 L360 120 L420 170 L370 230 L330 200 L330 400 L170 400 L170 200 L130 230 L80 170 Z" fill="#2e1065" stroke="#9d4edd" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Collar Collar Flaps -->
    <polygon points="190,85 230,140 250,95 270,140 310,85 250,115" fill="#2e1065" stroke="#9d4edd" stroke-width="3"/>
    <!-- Button Placket line -->
    <line x1="250" y1="115" x2="250" y2="400" stroke="#9d4edd" stroke-width="3"/>
    <!-- Buttons -->
    <circle cx="250" cy="160" r="4" fill="#9d4edd"/>
    <circle cx="250" cy="220" r="4" fill="#9d4edd"/>
    <circle cx="250" cy="280" r="4" fill="#9d4edd"/>
    <circle cx="250" cy="340" r="4" fill="#9d4edd"/>
    <!-- Pocket -->
    <rect x="190" y="180" width="45" height="50" rx="4" fill="rgba(255,255,255,0.05)" stroke="#9d4edd" stroke-width="2"/>
  </g>

</svg>