<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14192e"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2136"/>
      <stop offset="50%" stop-color="#111424"/>
      <stop offset="100%" stop-color="#0a0c17"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Hanger -->
  <path d="M 200 70 Q 200 50 215 50 Q 225 50 220 65 Q 215 75 200 90 L 140 120 L 260 120 Z" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>

  <!-- T-Shirt Body -->
  <path d="M 140 120 L 100 150 L 125 200 L 150 185 L 150 330 L 250 330 L 250 185 L 275 200 L 300 150 L 260 120 C 240 140 160 140 140 120 Z" fill="url(#fabric)" stroke="#00f3ff" stroke-width="1.5"/>
  
  <!-- Collar -->
  <path d="M 160 120 C 170 145 230 145 240 120" fill="none" stroke="#2a3352" stroke-width="4"/>

  <!-- Nike Swoosh Logo -->
  <path d="M 175 165 C 185 175 200 180 220 165 C 205 175 190 178 180 173 Z" fill="#00f3ff" filter="url(#glow)"/>
</svg>
