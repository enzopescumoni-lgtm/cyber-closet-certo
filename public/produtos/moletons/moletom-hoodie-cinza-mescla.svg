<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141936" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090c1e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050711"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f3ff" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="neonGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Box -->
  <rect width="500" height="500" rx="24" fill="url(#studioGlow)"/>
  
  <!-- Studio Circular Podium Light -->
  <ellipse cx="250" cy="410" rx="160" ry="40" fill="rgba(0,243,255,0.03)" filter="drop-shadow(0 0 20px #00f3ff)"/>
  <ellipse cx="250" cy="410" rx="120" ry="25" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#softShadow)">
    <!-- Hoodie Base -->
    <path d="M140 130 L180 80 L320 80 L360 130 L430 185 L380 245 L330 215 L330 380 L170 380 L170 215 L120 245 L70 185 Z" fill="#475569" stroke="#00f3ff" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Hood shape -->
    <path d="M180 80 C200 45, 300 45, 320 80 C290 120, 210 120, 180 80 Z" fill="#475569" stroke="#00f3ff" stroke-width="3"/>
    <!-- Drawstrings -->
    <path d="M220 110 L215 170" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M280 110 L285 170" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Kangaroo Pocket -->
    <path d="M200 290 L300 290 L320 370 L180 370 Z" fill="rgba(255,255,255,0.06)" stroke="#00f3ff" stroke-width="2.5"/>
    <!-- Ribbed Cuffs -->
    <rect x="170" y="380" width="160" height="25" rx="3" fill="#475569" stroke="#00f3ff" stroke-width="2"/>
  </g>

</svg>