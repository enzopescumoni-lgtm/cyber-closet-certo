<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141936" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090c1e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050711"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f3ff" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="neonGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Box -->
  <rect width="500" height="500" rx="24" fill="url(#studioGlow)"/>
  
  <!-- Studio Circular Podium Light -->
  <ellipse cx="250" cy="410" rx="160" ry="40" fill="rgba(0,243,255,0.03)" filter="drop-shadow(0 0 20px #00f3ff)"/>
  <ellipse cx="250" cy="410" rx="120" ry="25" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#softShadow)">
    <!-- Shorts Body -->
    <path d="M150 120 L350 120 L340 330 L260 330 L250 210 L240 330 L160 330 Z" fill="#111827" stroke="#00f3ff" stroke-width="4" stroke-linejoin="round"/>
    <!-- Elastic Waistband -->
    <rect x="150" y="120" width="200" height="30" fill="rgba(255,255,255,0.08)" stroke="#00f3ff" stroke-width="2.5"/>
    <!-- Drawstring -->
    <path d="M235 150 L230 190" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M265 150 L270 190" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Cargo Side Pockets -->
    <rect x="145" y="200" width="40" height="60" rx="6" fill="rgba(255,255,255,0.08)" stroke="#00f3ff" stroke-width="2.5"/>
    <rect x="315" y="200" width="40" height="60" rx="6" fill="rgba(255,255,255,0.08)" stroke="#00f3ff" stroke-width="2.5"/>
  </g>

</svg>