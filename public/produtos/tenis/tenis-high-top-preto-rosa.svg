<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141936" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#090c1e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050711"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="neonGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Box -->
  <rect width="500" height="500" rx="24" fill="url(#studioGlow)"/>
  
  <!-- Studio Circular Podium Light -->
  <ellipse cx="250" cy="410" rx="160" ry="40" fill="rgba(0,243,255,0.03)" filter="drop-shadow(0 0 20px #ff007f)"/>
  <ellipse cx="250" cy="410" rx="120" ry="25" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#softShadow)">
    <!-- Sneaker Silhouette -->
    <path d="M90 280 C100 180, 190 180, 240 210 L350 220 C420 230, 440 290, 440 330 L80 330 Z" fill="#1e1b2e" stroke="#ff007f" stroke-width="4" stroke-linejoin="round"/>
    <!-- Thick Rubber Outsole -->
    <rect x="80" y="330" width="360" height="35" rx="8" fill="#f8fafc" stroke="#ff007f" stroke-width="2.5"/>
    <!-- Sole Tread Detail -->
    <line x1="80" y1="348" x2="440" y2="348" stroke="#ff007f" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- Heel Counter Overlay -->
    <path d="M90 280 C100 240, 140 240, 150 330 Z" fill="rgba(255,255,255,0.12)" stroke="#ff007f" stroke-width="2"/>
    <!-- Laces Eyestay -->
    <path d="M210 210 L300 235" stroke="#ff007f" stroke-width="6" stroke-linecap="round"/>
    <path d="M220 235 L310 260" stroke="#ff007f" stroke-width="6" stroke-linecap="round"/>
    <path d="M230 260 L320 285" stroke="#ff007f" stroke-width="6" stroke-linecap="round"/>
    <!-- Side Stripe Accent -->
    <path d="M160 300 Q260 240 380 295" fill="none" stroke="#ff007f" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>